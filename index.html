<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>atvknox's home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 60px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 720px;
            animation: intro 0.8s ease-out;
        }
        h2 {
            font-family: monospace;
            font-size: 1.4rem;
            margin-top: 45px;
            margin-bottom: 15px;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.9;
            color: #aaaaaa;
            margin-bottom: 18px;
        }
        p a {
            color: #ffffff;
            text-decoration: underline;
        }
        .external-links {
            margin-top: 50px;
            font-family: monospace;
            font-size: 1.1rem;
        }
        .external-links a {
            color: #ffffff;
            text-decoration: none;
        }
        .external-links a:hover {
            text-decoration: underline;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.95rem;
            color: #555555;
            font-family: monospace;
        }
        @keyframes intro {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container"> 
        <h2>ATRNXA</h2>
        <p>Welcome to the organization hub. Ongoing projects and system configurations are deployed here.</p>
        
        <div class="external-links">
            <a href="https://github.com/ATRNXA" target="_blank">> github org</a>
        </div>

        <div class="footer">
            <p>// active configuration</p>
        </div>
    </div>
</body>
